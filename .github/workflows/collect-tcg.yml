name: Collect TCG market

# 게임별 경매 시장 — 원피스 하나만 깊게 파던 걸, 다른 TCG 는 넓고 얕게 같이 본다.
# 스냅샷은 하루 1회(진행 중 건수는 하루 사이에 크게 안 변한다), 정산은 6시간마다
# (경매가 끝난 뒤 30시간 안에 읽어야 조회가 된다 — 하루 한 번이면 놓치는 게 생긴다).
#
# data/tcg-snapshot.json · data/tcg-watch.json · data/tcg-archive/ 는 이 워크플로가 단독 소유한다.
# 원피스 원장(data/auction-archive)은 절대 건드리지 않는다 — 섞이면 원피스 통계가 오염된다.

on:
  workflow_dispatch:
  schedule:
    # ⚠️ cron 을 두 줄로 나눈 이유: github.event.schedule 은 **매칭된 cron 문자열 그대로**다.
    #    한 줄에 "0 0,6,12,18 * * *" 로 몰아넣으면 매 실행마다 그 문자열이 그대로 들어와,
    #    "자정에만 스냅샷" 같은 조건을 걸 방법이 없다(조건이 영영 거짓이 되어 스냅샷이 안 돈다).
    - cron: "0 0 * * *"          # 스냅샷 + 정산 (KST 09:00)
    - cron: "0 6,12,18 * * *"    # 정산만 (KST 15:00 · 21:00 · 03:00)

permissions:
  contents: write

concurrency:
  group: collect-tcg
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      EBAY_MARKETPLACE_ID: EBAY_US

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 스냅샷은 하루 한 번이면 충분하다. 여러 번 찍어도 같은 날 줄을 덮어쓸 뿐인데,
      # 그러면 "하루 중 언제 잰 값인가"가 매번 달라져 날짜끼리 비교가 흔들린다.
      # 쿼터 게이트를 두지 않는다 — 스냅샷·정산 모두 tools/ebay-budget.js 로 잔여량을 보고
      # 스스로 건너뛴다(exit 0). 게이트가 exit 1 로 워크플로를 죽이면 그 회차 정산이 통째로 비어
      # 부분수집이 된다(settle-auctions.yml 참고).
      - name: Snapshot (once a day)
        if: github.event.schedule == '0 0 * * *' || github.event_name == 'workflow_dispatch'
        run: node tools/collect-tcg-snapshot.js

      # 정산은 자주 돌아야 한다. 종료 후 30시간이 지나면 조회가 안 되고, 그 건은 영영 빈칸이 된다.
      - name: Settle ended auctions
        run: node tools/settle-tcg.js

      # 원본이 바뀌면 화면이 읽는 집계도 같이 다시 굽는다. 안 하면 화면만 하루 뒤처진다.
      - name: Build series
        run: node tools/build-tcg-series.js

      - name: Guard
        run: node tools/guard-invariants.js

      - name: Commit changes
        run: |
          # 감지 목록과 커밋 목록은 반드시 같아야 한다 — 어긋나면 "변경은 있는데 커밋은 안 되는"
          # 구멍이 생기고, 미스테이징 변경 때문에 다음 rebase 가 통째로 죽는다(2026-07-20 실사고).
          # git diff 대신 status 를 쓰는 이유: tcg-archive 의 새 날짜 파일은 아직 추적 전이라
          # diff 에는 안 잡힌다. 그대로 두면 첫날 데이터가 조용히 사라진다.
          if [ -z "$(git status --porcelain data/tcg-snapshot.json data/tcg-watch.json data/tcg-series.json data/tcg-archive)" ]; then
            echo "No TCG changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tcg-snapshot.json data/tcg-watch.json data/tcg-series.json data/tcg-archive
          git commit -m "Collect TCG auction data"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Push failed after 3 attempts."
              exit 1
            fi
            echo "Push raced; rebasing before retry $((attempt + 1))/3."
            git pull --rebase
          done
