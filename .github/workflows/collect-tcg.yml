name: Collect TCG market

# 게임별 경매 시장 — 원피스 하나만 깊게 파던 걸, 다른 TCG 는 넓고 얕게 같이 본다.
# 스냅샷은 하루 1회(진행 중 건수는 하루 사이에 크게 안 변한다), 정산은 3시간마다
# (경매가 끝난 뒤 30시간 안에 읽어야 조회가 된다 — 하루 한 번이면 놓치는 게 생긴다).
#
# data/tcg-snapshot.json · data/tcg-watch.json · data/tcg-archive/ 는 이 워크플로가 단독 소유한다.
# 원피스 원장(data/auction-archive)은 절대 건드리지 않는다 — 섞이면 원피스 통계가 오염된다.

on:
  workflow_dispatch:
  schedule:
    # ⚠️ cron 을 두 줄로 나눈 이유: github.event.schedule 은 **매칭된 cron 문자열 그대로**다.
    #    한 줄에 "0 0,6,12,18 * * *" 로 몰아넣으면 매 실행마다 그 문자열이 그대로 들어와,
    #    "자정에만 스냅샷" 같은 조건을 걸 방법이 없다(조건이 영영 거짓이 되어 스냅샷이 안 돈다).
    # 정산을 3시간마다(하루 8회)로 늘렸다 — 2026-09-03 소유자 지시("TCG 경매에도 토큰 최대로").
    # 실측: 게임당 250건 × 13종 = 하루 3,250건이 감시로 들어오는데 정산이 4회뿐이라
    # 한 번에 670건이 밀려 있었다. 종료 후 30시간이면 조회가 막혀 영구 소실이므로 여유가 없다.
    # 8회로 늘리면 회차당 처리량이 절반이면 되고, 크론이 몇 번 빠져도 버틴다.
    # eBay 쿼터 창은 **07:00 UTC(KST 16:00)** 에 리셋된다(실측 2026-09-03, analytics reset 값).
    # 스냅샷(~340콜, 그 순간에만 존재하는 값)은 창이 열린 직후에 찍어야 굶지 않는다 —
    # 종전 00:00 UTC 는 창의 끝이라 잔여가 바닥나 8/29·8/30·9/1 스냅샷이 통째로 빠졌다.
    - cron: "30 7 * * *"                    # 스냅샷 + 정산 (창 시작, KST 16:30)
    - cron: "30 1,4,10,13,16,19,22 * * *"   # 정산만 (3시간 간격)

permissions:
  contents: write

concurrency:
  group: collect-tcg
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      EBAY_MARKETPLACE_ID: EBAY_US

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 스냅샷 자기치유 — 2026-09-03. 종전엔 00시(UTC) 크론에만 스냅샷 조건을 걸었는데,
      # GitHub 이 그 크론 하나를 통째로 건너뛰면(실제로 8/29·8/30·9/1·9/3 네 번 일어났다)
      # 그날 스냅샷이 영영 빈다 — 스냅샷은 시점 기록이라 소급이 안 된다.
      # 이제 **매 실행(0·3·6·9·12·15·18·21시)에 시도**한다. 스크립트가 "오늘 점이 이미 있으면 skip" 가드를
      # 갖고 있어(2026-08-31) 하루 한 번만 실제로 찍힌다. 00시가 빠져도 03시가 메꾼다.
      # 대가: 빠진 날은 측정 시각이 00시가 아니라 다음 3시간 회차가 된다 — 빈칸보다 백배 낫다.
      # 쿼터 게이트는 두지 않는다 — 스냅샷·정산 모두 tools/ebay-budget.js 로 스스로 판단한다.
      - name: Snapshot (self-healing, once a day)
        run: node tools/collect-tcg-snapshot.js

      # 정산은 자주 돌아야 한다. 종료 후 30시간이 지나면 조회가 안 되고, 그 건은 영영 빈칸이 된다.
      - name: Settle ended auctions
        run: node tools/settle-tcg.js

      # 원본이 바뀌면 화면이 읽는 집계도 같이 다시 굽는다. 안 하면 화면만 하루 뒤처진다.
      - name: Build series
        run: node tools/build-tcg-series.js

      - name: Guard
        run: node tools/guard-invariants.js

      - name: Commit changes
        run: |
          # 감지 목록과 커밋 목록은 반드시 같아야 한다 — 어긋나면 "변경은 있는데 커밋은 안 되는"
          # 구멍이 생기고, 미스테이징 변경 때문에 다음 rebase 가 통째로 죽는다(2026-07-20 실사고).
          # git diff 대신 status 를 쓰는 이유: tcg-archive 의 새 날짜 파일은 아직 추적 전이라
          # diff 에는 안 잡힌다. 그대로 두면 첫날 데이터가 조용히 사라진다.
          if [ -z "$(git status --porcelain data/tcg-snapshot.json data/tcg-watch.json data/tcg-series.json data/tcg-archive)" ]; then
            echo "No TCG changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tcg-snapshot.json data/tcg-watch.json data/tcg-series.json data/tcg-archive
          git commit -m "Collect TCG auction data"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Push failed after 3 attempts."
              exit 1
            fi
            echo "Push raced; rebasing before retry $((attempt + 1))/3."
            git pull --rebase
          done
