name: Update active listing links
# rerun 2026-07-10 (secret fixed)
# rerun 2026-07-22: audit-seo 가 eb-05·op-17 의 FAQ 스키마 누락으로 실패(숨긴 FAQ 정리 때 제거됨) → 보이는 FAQ+스키마 복원 후 재실행

# push 트리거는 2026-09-07 제거 — 워크플로 파일을 고칠 때마다 전체 수집이 예정에 없이 돌았고(쿼터 없는 시간이면 게이트에서 실패 메일),
# 검증은 self-heal 워크플로의 테스트 스텝이 이미 한다. 수동 실행은 workflow_dispatch.
on:
  workflow_dispatch:
  schedule:
    # Every day at 03:00 KST (18:00 UTC).
    - cron: "0 18 * * *"

permissions:
  contents: write

concurrency:
  group: update-active-listing-links
  cancel-in-progress: false

jobs:
  # 크론이 늦게 오면(18:00 예정 → 20:51 실측, 2026-09-07) 자가치유 dispatch(20:17) 와 겹쳐 하루 두 번 돈다.
  # 한 번에 eBay 콜 ~600 이라 두 번이면 창 잔여가 0 이 되고 그날 TCG 정산이 통째로 굶는다(9/7 TCG 38건).
  # 예약 실행은 "오늘(UTC) 이미 갱신됐으면" 건너뛴다. 수동 실행(workflow_dispatch)은 항상 돈다.
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          today=$(date -u +%F)
          # 예약 실행의 checkout 은 트리거 시점 커밋이라, 직전에 끝난 수동 실행의 결과를 못 본다
          # (2026-09-09 실제: 20:01 수동 실행 성공 → 20:06 예약 실행이 또 돌다 푸시 충돌로 실패). 최신 main 의 파일로 판단한다.
          git fetch -q --depth=1 origin main && git show origin/main:data/active-listing-audit.json > /tmp/active-listing-audit.json 2>/dev/null || cp data/active-listing-audit.json /tmp/active-listing-audit.json
          updated=$(node -e "try{console.log(String(require('/tmp/active-listing-audit.json').updated||'').slice(0,10))}catch(e){console.log('')}")
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$updated" = "$today" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "already updated today ($updated) — scheduled run skipped"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "proceed (event=${{ github.event_name }}, updated=$updated)"
          fi

  update:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      EBAY_MARKETPLACE_ID: EBAY_US
      EBAY_PSA_ACTIVE_SEARCH_LIMIT: "100"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # 2026-10-06 d37527b8 부터 tools/generate-box-thumbnails.js 가 sharp 를 쓴다(package.json 에 선언돼 있음).
      # 이 러너에는 node_modules 가 없어서 재생성 단계가 'Cannot find module sharp' 로 죽었다(10/6 18:00·21:54 UTC 두 번).
      # 생성기엔 dev 의존성(lighthouse·puppeteer-core)이 필요 없으니 --omit=dev. lockfile 기준으로 npm ci.
      - name: Install dependencies
        run: npm ci --omit=dev --no-audit --no-fund

      # 수집 전 빠른 검사 = 모든 도구 구문(node --check) + 단위 테스트. 검사 목록은 tools/check.js 한 곳이다(2026-10-15).
      # 여기서 가드·감사를 '실행'하면 안 된다 — 2026-07-27 교착.
      # 가드에는 데이터 신선도 검사(T1/P1)가 있는데, 이 잡의 목적이 바로 그 데이터를
      # 새로 받는 것이다. 데이터가 낡으면 가드가 막고 → 갱신을 못 하고 → 더 낡는다.
      # 실제로 eBay 키 만료로 5일 밀리자 이 줄 때문에 파이프라인이 영구히 죽었다.
      # 진짜 관문은 아래 "Check (block bad deploys)" — 갱신 뒤 커밋 직전에 돈다.
      - name: Verify scripts
        run: node tools/check.js --pre

      - name: Require eBay API secrets
        run: |
          if [ -z "$EBAY_CLIENT_ID" ] || [ -z "$EBAY_CLIENT_SECRET" ]; then
            echo "::error::Missing EBAY_CLIENT_ID or EBAY_CLIENT_SECRET repository secret. Active listing refresh cannot run safely."
            exit 1
          fi

      # eBay Browse 한도는 하루 5,000콜이다. 바닥일 때 시작하면 전부 429 로 실패하고
      # 원장에는 구멍만 남는다(2026-09-01 실측: settle 이 due 391건 중 390건을 놓쳤다).
      # 남은 콜이 이 회차에 필요한 양보다 적으면 여기서 멈춘다 — 감시목록은 그대로라 다음 회차에 재시도된다.
      # --reserve tcgSnapshot: 이 창의 00:18 UTC TCG 스냅샷 몫(그날 점이 아직 없을 때 ~124콜)을 더 남긴다 — 2026-10-14.
      - name: eBay quota gate
        run: node tools/check-ebay-quota.js --min 400 --reserve tcgSnapshot

      - name: Update eBay active box links
        run: |
          set -o pipefail
          mkdir -p logs
          node tools/run-with-retry.js --attempts 3 --delay-ms 10000 -- node tools/update-ebay-pack-prices.js 2>&1 | tee logs/update-ebay-pack-prices.log

      - name: Update eBay English box prices
        run: |
          set -o pipefail
          mkdir -p logs
          node tools/run-with-retry.js --attempts 3 --delay-ms 10000 -- node tools/update-ebay-english-pack-prices.js 2>&1 | tee logs/update-ebay-english-pack-prices.log

      - name: Collect pre-order box prices (sets not released yet)
        run: |
          set -o pipefail
          mkdir -p logs
          node tools/run-with-retry.js --attempts 3 --delay-ms 10000 -- node tools/collect-preorder-prices.js 2>&1 | tee logs/collect-preorder-prices.log

      - name: Update eBay active PSA10 links
        run: |
          set -o pipefail
          mkdir -p logs
          node tools/run-with-retry.js --attempts 3 --delay-ms 10000 -- node tools/update-ebay-psa10-active-links.js 2>&1 | tee logs/update-ebay-psa10-active-links.log

      - name: Refresh English box sold series (Finding API)
        run: |
          set -o pipefail
          mkdir -p logs
          node tools/backfill-english-box-series.js 2>&1 | tee logs/backfill-english-box-series.log || echo "Finding API unavailable - skipping"

      - name: Append box price history snapshot
        run: |
          set -o pipefail
          mkdir -p logs
          node tools/update-box-series-history.js 2>&1 | tee logs/update-box-series-history.log

      - name: Append card price history snapshot
        run: |
          set -o pipefail
          mkdir -p logs
          node tools/update-card-series-history.js 2>&1 | tee logs/update-card-series-history.log

      - name: Append supply series (listing counts + new/gone)
        run: |
          set -o pipefail
          mkdir -p logs
          node tools/update-supply-series.js 2>&1 | tee logs/update-supply-series.log
          node tools/fetch-auction-deals.js 2>&1 | tee logs/fetch-auction-deals.log

      - name: Audit active listing quality
        run: |
          set -o pipefail
          mkdir -p logs
          node tools/audit-active-listings.js 2>&1 | tee logs/audit-active-listings.log
          # 가격 품질 감사 — collect-status 가 이 워크플로 몫으로 기대하는 산출물인데 실행이 빠져 있었다(2026-09-07 발견).
          # --hide-suspicious-nm 은 packs.json 을 들여쓰기로 저장한다 → 다음 단계의 compact-series 가 되돌린다.
          node tools/audit-price-quality.js --hide-suspicious-nm 2>&1 | tee logs/audit-price-quality-hide.log
          node tools/audit-price-quality.js 2>&1 | tee logs/audit-price-quality.log

      # PSA10 활성 구매링크 전수 오매칭 감사(읽기 전용, 카드당 getItem 1회 ≈ 180회/일, 약 90초).
      # 감사가 막혀도 매물 갱신은 계속돼야 하므로 실패를 삼킨다.
      - name: Audit PSA10 listing mismatches
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p logs
          node tools/audit-psa10-mismatches.js 2>&1 | tee logs/audit-psa10-mismatches.log

      # 세트별 경매 실적(data/set-auction-stats.json) — 세트·영문 세트·ko·경매 페이지와 AI 파일이 읽는다.
      # 예전엔 생성기들 뒤에 돌아 화면이 하루 묵은 값을 실었다(2026-10-13 발견). 반드시 build 보다 먼저 돈다(audit-workflows 5번).
      # tools/build.js 에 넣지 않은 이유: 창 끝이 "오늘"(window.to)이라 같은 원장에서도 날마다 다른 파일이 나온다 — 빌드는 결정적이어야 한다.
      # 경매 원장을 매일 받는 이 워크플로가 유일한 실행처다. 다른 빌드(주간·daily.ps1)는 커밋된 파일(최대 하루 전)을 읽는다.
      - name: Build set auction stats
        run: |
          set -o pipefail
          mkdir -p logs
          node tools/build-set-auction-stats.js 2>&1 | tee logs/build-set-auction-stats.log

      # 반다이 공식 카드리스트(JP·EN) → data/official-cardlist.json — 2026-10-14(W7). 사실 열만(효과 텍스트·이미지 없음), 요청 간 2초.
      # 실패해도 직전 파일을 그대로 두고 0 으로 끝난다. OP-18·EB-05 처럼 새 상품이 공식 목록에 뜨는 날 아래 build 가 그날 페이지를 만든다.
      # 네트워크 수집이라 tools/build.js 밖이다. fetch-box-images 는 packs.json 을 들여쓰기로 저장한다 → build 의 compact-series 가 되돌린다(그래서 build 앞).
      - name: Fetch official card list and images
        run: |
          set -o pipefail
          mkdir -p logs
          node tools/fetch-official-cardlist.js 2>&1 | tee logs/fetch-official-cardlist.log
          # 발매 전 세트의 반다이 상품 페이지(JP·EN)·카드리스트 공개 여부 → data/bandai-product-check.json(2026-10-19). 실패해도 0 — 직전 확인일이 남는다.
          node tools/check-bandai-product-pages.js 2>&1 | tee logs/check-bandai-product-pages.log
          node tools/fetch-box-images.js 2>&1 | tee logs/fetch-box-images.log
          node tools/fetch-card-images.js 2>&1 | tee logs/fetch-card-images.log

      # 생성 순서는 tools/build.js 한 곳이다(2026-10-15) — 원장 파생 데이터 → 페이지 → AI 파일 → 주입기 → 메뉴·피드·사이트맵.
      # 단계별 전체 출력은 logs/<step>.log(아티팩트). 한 단계가 죽으면 거기서 멈추고 그 출력을 그대로 보여준다.
      - name: Build (regenerate every derived page and data file)
        run: node tools/build.js --log-dir logs

      # 검사(단위 테스트·감사·가드)는 tools/check.js 한 곳이다(2026-10-15). 실패 이유를 실행 화면(annotation + summary)에 직접 띄운다 — 2026-07-27:
      # 저장소 로그 다운로드는 admin 권한이 필요해, 실패해도 왜 실패했는지 볼 수가 없었다. 세 번을 추측으로 헤맸다. 이유는 반드시 화면에 남긴다.
      # --gate: 전역 신선도 감사(audit-collection-health·audit-series-gaps)는 뺀다 — 남의 지연이 이번 수집을 버리게 하면 안 된다(가드 W4).
      #         그 둘은 collection-health.yml 이 하루 두 번 본다. 얇은 페이지 감사는 알림용(실패시키지 않음).
      - name: Check (tests, audits, guard — block bad deploys)
        run: node tools/check.js --gate --log-dir logs

      # 업로드는 가드 뒤에 둔다 — 앞에 있으면 정작 필요한 guard-invariants.log 가 빠진다.
      # 커밋 앞이라 커밋·푸시가 실패해도 이 실행이 받은 데이터가 남는다(10/8·10/9 'unstaged' 실패 때 그날 매물 관측을 잃었다).
      # data/ 통째(79MB) 대신 이 워크플로가 쓰는 파일을 적는다 — 2026-10-14. 커밋 목록(git add)과 같은 data 파일이다.
      - name: Upload update logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-listing-update-logs
          path: |
            logs/
            data/onepiece-packs.json
            data/box-sold-series.json
            data/grading-series.json
            data/derived/site-facts.json
            data/card-series.json
            data/supply-series.json
            data/listing-ids.json
            data/preorder-series.json
            data/active-listing-audit.json
            data/price-quality-audit.json
            data/psa10-mismatch-audit.json
            data/set-auction-stats.json
            data/image-variants.json
            data/auction-stats.json
            data/auction-deals.json
            data/official-cardlist.json
            data/bandai-product-check.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit changes
        run: |
          if git diff --quiet data/onepiece-packs.json data/box-sold-series.json data/grading-series.json data/card-series.json data/active-listing-audit.json data/price-quality-audit.json data/psa10-mismatch-audit.json data/set-auction-stats.json data/supply-series.json data/preorder-series.json data/image-variants.json data/listing-ids.json data/auction-stats.json data/auction-deals.json data/official-cardlist.json data/bandai-product-check.json logs/en-backfill-status.json sets/ cards/ ko/ img/ card-img/ index.html packs.html auction.html box-prices.html tcg-auction.html compare.html articles/ free-data.html weekly.html psa10-ranking.html market-2026.html feed.xml opbox-ai-data.json opbox-ai-cards.json opbox-ai-grading.json opbox-ai-auctions.json llms.txt llms-full.txt opbox-set-prices.csv opbox-grading-population.csv opbox-auction-daily.csv sitemap.xml data/sitemap-lastmod-state.json ja/ about.html amazon-lottery.html changelog.html disclaimer.html methodology.html privacy.html psa-grading.html; then
            echo "No active listing changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/onepiece-packs.json data/box-sold-series.json data/grading-series.json data/card-series.json data/active-listing-audit.json data/price-quality-audit.json data/psa10-mismatch-audit.json data/set-auction-stats.json data/supply-series.json data/preorder-series.json data/image-variants.json data/listing-ids.json data/auction-stats.json data/auction-deals.json data/official-cardlist.json data/bandai-product-check.json logs/en-backfill-status.json sets/ cards/ ko/ img/ card-img/ index.html packs.html auction.html box-prices.html tcg-auction.html compare.html articles/ free-data.html weekly.html psa10-ranking.html market-2026.html feed.xml opbox-ai-data.json opbox-ai-cards.json opbox-ai-grading.json opbox-ai-auctions.json llms.txt llms-full.txt opbox-set-prices.csv opbox-grading-population.csv opbox-auction-daily.csv sitemap.xml data/sitemap-lastmod-state.json ja/ about.html amazon-lottery.html changelog.html disclaimer.html methodology.html privacy.html psa-grading.html
          if ! git diff --quiet; then
            echo "::error::Tracked generated files remain unstaged. Update the explicit commit scope before publishing."
            git status --short
            exit 1
          fi
          git commit -m "Update active listing links + regenerate SEO set/card pages"
          # A content edit can land while this long-running collector is working.
          # Rebase generated data onto the latest main instead of losing the run.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Push failed after 3 attempts. Generated data was not published."
              exit 1
            fi
            echo "Push raced with another commit; rebasing before retry $((attempt + 1))/3."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Generated files conflict with newer main. Manual review required."
              exit 1
            fi
            # Rebase can change source data or generators without a text conflict.
            # Rebuild every local derived output before publishing the merged tree — 같은 순서(집계 → build → check), 2026-10-15.
            node tools/build-set-auction-stats.js
            node tools/build.js
            node tools/check.js --gate
            git add data/onepiece-packs.json data/box-sold-series.json data/grading-series.json data/card-series.json data/active-listing-audit.json data/price-quality-audit.json data/psa10-mismatch-audit.json data/set-auction-stats.json data/supply-series.json data/preorder-series.json data/image-variants.json data/listing-ids.json data/auction-stats.json data/auction-deals.json data/official-cardlist.json data/bandai-product-check.json logs/en-backfill-status.json sets/ cards/ ko/ img/ card-img/ index.html packs.html auction.html box-prices.html tcg-auction.html compare.html articles/ free-data.html weekly.html psa10-ranking.html market-2026.html feed.xml opbox-ai-data.json opbox-ai-cards.json opbox-ai-grading.json opbox-ai-auctions.json llms.txt llms-full.txt opbox-set-prices.csv opbox-grading-population.csv opbox-auction-daily.csv sitemap.xml data/sitemap-lastmod-state.json ja/ about.html amazon-lottery.html changelog.html disclaimer.html methodology.html privacy.html psa-grading.html
            if ! git diff --quiet; then
              echo "::error::Post-rebase regeneration left tracked files unstaged."
              git status --short
              exit 1
            fi
            git diff --cached --quiet || git commit --amend --no-edit
            sleep $((attempt * 5))
          done

      # 검색엔진에 갱신을 즉시 통지 — IndexNow(Bing·Naver·Yandex). 구글은 안 받지만 네이버 색인 지연을 줄인다.
      # 2026-10-14(W9): 사이트맵 전체 대신 lastmod 가 오늘인 URL(=오늘 본문이 바뀐 페이지)만 보낸다. 실패해도 갱신을 막지 않는다.
      # 2026-10-19: lastmod ≥ 오늘−2일(cron 이 빠진 날 보충) + 월요일 AI 인용 데이터 페이지 전체 + 발매 창 페이지 매일(tools/indexnow-submit.js 머리 주석).
      - name: Notify IndexNow
        if: success()
        continue-on-error: true
        run: node tools/indexnow-submit.js
