name: Update FX

# 환율을 매일 갱신한다 — 2026-08-17 신설.
#
# 왜 만드나: fx.json 은 2026-07-01 값(1548.63)에 47일 멈춰 있었다. 갱신하는 워크플로우도
#   스크립트도 아예 없었기 때문이다. 그동안 실제 환율은 1411 까지 내렸고, eBay 가 원화로
#   보여주는 가격을 달러로 환산하는 12개 파일이 전부 8.9% 낮은 값을 쓰고 있었다.
#   더 나쁜 건 이게 원장에 굳어 들어갔다는 것이다 — 수집 시기만으로 같은 박스가 4.5% 싸
#   보였다. 시장이 만든 차이가 아니라 우리가 만든 차이다(tools/restore-box-fx.js 로 교정).
#
# 왜 매일인가: 일별 이력(data/fx-history.json)이 같이 쌓인다. 무료 API 는 과거를 며칠치밖에
#   안 주므로 소급이 안 된다. 나중에 "이 기록은 어느 환율로 환산됐나"를 되짚으려면 지금부터 쌓아야 한다.
#
# ECB 기준환율(frankfurter)은 영업일만 나온다. 주말·공휴일에 돌면 직전 영업일 값이 그대로
#   나오고, 그러면 커밋할 변경이 없어 조용히 넘어간다 — 실패가 아니다.

on:
  workflow_dispatch:
  schedule:
    # 매일 KST 09:10. ECB 고시(CET 16:00 무렵)가 반영된 뒤다.
    - cron: "10 0 * * *"

permissions:
  contents: write

concurrency:
  group: update-fx
  cancel-in-progress: false

jobs:
  fx:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update FX
        run: |
          set -o pipefail
          mkdir -p logs
          node tools/update-fx.js 2>&1 | tee logs/update-fx.log

      # 환율이 갑자기 크게 튀면 상류가 깨진 것일 수 있다. 하루 5% 넘게 움직이면 멈춘다.
      # (실제 USD/KRW 가 하루 5% 움직이는 일은 거의 없다. 그런 날은 사람이 봐야 한다.)
      - name: Sanity check
        run: |
          node -e '
            const fx = require("./data/fx.json");
            const h = require("./data/fx-history.json").rates;
            const days = Object.keys(h).sort();
            const cur = h[days[days.length - 1]], prev = h[days[days.length - 2]];
            if (!(fx.usdKrw > 500 && fx.usdKrw < 3000)) { console.error("usdKrw 범위 이탈: " + fx.usdKrw); process.exit(1); }
            if (prev && Math.abs(cur / prev - 1) > 0.05) { console.error("일간 변동 5% 초과: " + prev + " -> " + cur); process.exit(1); }
            console.log(JSON.stringify({ ok: true, date: fx.date, usdKrw: fx.usdKrw, days: days.length }));
          '

      - name: Refresh compact AI data
        run: |
          node --check tools/market-data-normalizers.js
          node --check tools/ai-data-model.js
          node --check tools/generate-ai-data.js
          node --check tools/test-ai-data.js
          node --check tools/robots-policy.js
          node --check tools/audit-ai-discovery.js
          node --check tools/guard-invariants.js
          node tools/generate-ai-data.js
          node tools/test-ai-data.js
          node tools/audit-ai-discovery.js
          node tools/guard-invariants.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # onepiece-packs.json 도 같이 커밋한다 — 화면(packs.js triMain)과 페이지 생성기가
          # 읽는 환율은 fx.json 이 아니라 이 파일 안에 복사된 fx 다. 빠뜨리면 원장만 새 환율로
          # 가고 화면은 옛 환율에 남는다(2026-08-17 실제 사고).
          git add data/fx.json data/fx-history.json data/onepiece-packs.json opbox-ai-data.json
          if ! git diff --quiet; then
            echo "::error::Tracked FX or generated files remain unstaged. Update the explicit commit scope."
            git status --short
            exit 1
          fi
          git diff --cached --quiet && echo "변경 없음(영업일 아님이거나 동일 고시)" && exit 0
          git commit -m "Update FX rate"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Push failed after 3 attempts. FX and AI data were not published."
              exit 1
            fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::FX data conflicts with newer main. Manual review required."
              exit 1
            fi
            node tools/generate-ai-data.js
            node tools/test-ai-data.js
            node tools/audit-ai-discovery.js
            node tools/guard-invariants.js
            git add data/fx.json data/fx-history.json data/onepiece-packs.json opbox-ai-data.json
            if ! git diff --quiet; then
              echo "::error::Post-rebase regeneration left tracked files unstaged."
              git status --short
              exit 1
            fi
            git diff --cached --quiet || git commit --amend --no-edit
            sleep $((attempt * 5))
          done
