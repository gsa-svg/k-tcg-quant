name: Collection health

# 수집이 조용히 멈추는 걸 잡는 감시자 — 2026-08-07 신설.
#
# 왜 별도 워크플로인가: 수집 워크플로 안에서만 검사하면, **그 워크플로가 아예 안 도는 경우**를 못 잡는다.
# 실제로 2026-08-05 에 PSA 주간 수집이 2주 동안 조용히 죽어 있었다. 그때 아무도 몰랐던 이유가 이것이다.
# 이 워크플로는 아무것도 수집하지 않고, 오직 "데이터가 늙지 않았는가"만 본다.
#
# 실패하면 GitHub 이 저장소 소유자에게 메일을 보낸다. 그게 알림이다.
# 경매·시계열은 소급 수집이 안 되므로, 하루라도 빨리 아는 게 전부다.

on:
  workflow_dispatch:
  schedule:
    # 하루 두 번 (KST 10:00 · 22:00). 모든 수집 워크플로가 한 번씩은 돌고 난 뒤 시각.
    - cron: "0 1,13 * * *"

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check data freshness
        run: node tools/audit-collection-health.js

      # 산출물이 오래됐다는 신호와 별개로, **수집기 자체가 실행 불가**인 경우를 잡는다.
      # 2026-08-24: 팰월드 수집기가 정규식 이스케이프 오류로 브라우저에서 죽어 있었는데
      # 산출물은 예전 값 그대로라 위 검사만으로는 "오래됨"으로만 보였다.
      - name: Check collectors are runnable
        run: node tools/audit-collectors.js

      # 숫자가 아니라 **귀속**을 본다: 화면에 붙은 등급 값이 정말 그 카드·그 변형·그 판의 것인가.
      # 2026-08-25: 재수록본에 원본 세트 인구가 붙어 있었고(PRB-01 샹크스 망가 81장 자리에 4,863장),
      # TR 카드에는 평범한 Base 행이 붙어 있었다. 숫자 검사만으로는 둘 다 정상으로 보였다.
      - name: Check grade attribution
        run: node tools/audit-grade-attribution.js

      # 그래프에 그려지는 점을 원장에서 다시 계산해 대조한다(값·사분위·표본·거래량·격자·마지막 판매일).
      # 화면 요약값(boxMarket.ebaySold)이 선의 마지막 점과 어긋나는 경우도 여기서 걸린다.
      - name: Check box chart series
        run: node tools/audit-box-series.js

      # 가격: 변형 오매칭 + **신선도**. 2026-08-25 실측으로 175장 중 80장이 옛 가격(최대 -53%)이었다.
      - name: Check price quality
        run: node tools/audit-price-quality.js

      # 위가 실패하면 여기까지 안 온다. 요약을 실행 화면에 남겨 메일만 보고도 상황을 알게 한다.
      - name: Summary
        if: always()
        run: |
          {
            echo "### Collection health"
            echo ""
            echo '```json'
            node tools/audit-collection-health.js || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
