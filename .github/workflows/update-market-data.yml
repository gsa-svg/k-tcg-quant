name: Update market data

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 05:00 KST (Sunday 20:00 UTC) — staggered 2h after the daily
    # active-listings run (18:00 UTC) to avoid a same-time push race on onepiece-packs.json.
    - cron: "0 20 * * 0"

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      EBAY_MARKETPLACE_ID: EBAY_US
      EBAY_PSA_SEARCH_LIMIT: "100"
      EBAY_ENGLISH_NM_SEARCH_LIMIT: "100"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 수집 전 빠른 검사 = 모든 도구 구문(node --check) + 단위 테스트. 검사 목록은 tools/check.js 한 곳이다(2026-10-15).
      # 가드·감사는 수집·재생성 뒤 "Check" 에서 돈다 — 수집 전에 신선도 검사를 돌리면 교착된다(일일 워크플로 2026-07-27).
      - name: Verify scripts
        run: node tools/check.js --pre

      - name: Require eBay API secrets
        run: |
          if [ -z "$EBAY_CLIENT_ID" ] || [ -z "$EBAY_CLIENT_SECRET" ]; then
            echo "::error::Missing EBAY_CLIENT_ID or EBAY_CLIENT_SECRET repository secret. Market data refresh cannot run safely."
            exit 1
          fi

      - name: Update eBay pack prices
        run: |
          set -o pipefail
          mkdir -p logs
          node tools/run-with-retry.js --attempts 3 --delay-ms 10000 -- node tools/update-ebay-pack-prices.js 2>&1 | tee logs/update-ebay-pack-prices.log

      # 일본 싱글 호가(遊々亭)는 여기서 돌리지 않는다 — 2026-09-30 단계 삭제, 가드 W3.
      # 8/25 에 "자동화"로 넣었지만 러너 IP 가 유유테이에서 403 을 받아(9/28 3a202e48 기록) 쓰기 전에 죽었고,
      # continue-on-error 라 성공처럼 보였다: 봇 실행 7회(8/28~9/27) 동안 nmUpdated 가 바뀐 적이 0번이다.
      # 실제 갱신은 전부 이 PC 수동(8/26·9/07·9/17·9/28). 10일 주기는 collect-status 의 nm 행이 감시한다.

      - name: Update eBay English NM prices
        run: |
          set -o pipefail
          mkdir -p logs
          node tools/run-with-retry.js --attempts 3 --delay-ms 10000 -- node tools/update-ebay-english-nm-prices.js 2>&1 | tee logs/update-ebay-english-nm-prices.log

      - name: Append box price history snapshot
        run: |
          set -o pipefail
          mkdir -p logs
          node tools/update-box-series-history.js 2>&1 | tee logs/update-box-series-history.log

      # ⚠️ GemRate 수집은 러너에서 자주 실패한다("OP-01: GemRate RowData unavailable").
      #    로컬 크롬(사용자 IP)에서는 같은 스크립트가 멀쩡히 도는 걸로 보아 데이터센터 IP 쪽 차단으로 보인다.
      #    이 스텝이 죽으면서 **뒤의 모든 스텝(가격 감사·페이지 재생성·커밋)까지 통째로 스킵**돼,
      #    2026-07-27·08-03 두 주 동안 주간 갱신이 아무것도 커밋되지 않았다(2026-08-03 확인).
      #    PSA 는 어차피 매주 월요일에 사람이 로컬에서 돌리기로 했으므로(HANDOFF 참고),
      #    여기서는 실패해도 나머지를 계속 진행시킨다. 값을 지어내는 게 아니라 그 주 PSA 점만 비는 것이다.
      - name: Collect and append verified PSA weekly history
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p logs
          node tools/collect-gemrate-psa-history.js 2>&1 | tee logs/collect-gemrate-psa-history.log
          node tools/import-gemrate-psa-history.js 2>&1 | tee logs/import-gemrate-psa-history.log

      # 판별(일본판/영문판) 누적을 매주 한 점씩 쌓는다. 화면에는 최근 두 점의 차이만 쓰지만
      # 점을 계속 보존해야 몇 달 뒤에 주차별 증가량을 우리 데이터로 말할 수 있다(소급 불가).
      # 위와 같은 이유로 실패해도 뒤를 막지 않는다 — 단, audit-grading-numbers 는 여기 두지 않고
      # 뒤의 Check(tools/check.js)에서 **등급 숫자 검증을 계속 강제**한다(그건 실패하면 진짜 멈춰야 한다).
      - name: Append per-edition PSA cumulative snapshot
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p logs
          node tools/collect-gemrate-en-totals.js 2>&1 | tee logs/collect-gemrate-en-totals.log
          node tools/collect-psa-edition-weekly.js 2>&1 | tee logs/collect-psa-edition-weekly.log
          node tools/import-gemrate-en-totals.js 2>&1 | tee logs/import-gemrate-en-totals.log
          node tools/inject-psa-wow.js 2>&1 | tee logs/inject-psa-wow.log

      # 가격 감사는 build 앞 — --hide-suspicious-nm 이 packs.json 을 들여쓰기로 저장하고, build 의 compact-series 가 되돌린다.
      - name: Audit price quality
        run: |
          set -o pipefail
          mkdir -p logs
          node tools/audit-price-quality.js --hide-suspicious-nm 2>&1 | tee logs/audit-price-quality-hide.log
          node tools/audit-price-quality.js 2>&1 | tee logs/audit-price-quality.log
          node tools/audit-active-listings.js 2>&1 | tee logs/audit-active-listings.log

      # 생성 순서는 tools/build.js 한 곳이다(2026-10-15). 카드별 등급 주입(inject-card-grades, 2026-08-20 — 원장만 새것이고 화면은
      # 옛것인 조용한 사고)과 등급 시계열(build-grading-series, 2026-08-19)도 그 안의 첫 단계들이다. 단계별 전체 출력은 logs/<step>.log.
      - name: Build (regenerate every derived page and data file)
        run: node tools/build.js --log-dir logs

      # 검사(단위 테스트·감사·가드)는 tools/check.js 한 곳이다(2026-10-15). 등급 숫자 감사(audit-grading-numbers — 젬률·주간 증감·
      # 등급사별 구간 라벨이 원본과 맞는가, 소유자 지시 "등급 숫자는 틀리면 안 된다")도 그 안에 있다 — 위 수집이 건너뛰어졌더라도
      # **이 검증만은 반드시 통과해야 한다**. 실패 이유는 실행 화면(annotation + summary)에 뜬다.
      # --gate: 전역 신선도 감사는 뺀다(가드 W4 — collection-health.yml 몫).
      - name: Check (tests, audits, guard — block bad deploys)
        run: node tools/check.js --gate --log-dir logs

      # 커밋 앞이라 가드 FAIL·커밋 실패에도 이 실행이 받은 데이터가 남는다. 커밋 목록(git add)의 data 파일을 적는다 — 2026-10-14.
      - name: Upload update logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-update-logs
          path: |
            logs/
            data/onepiece-packs.json
            data/grading-series.json
            data/box-sold-series.json
            data/derived/site-facts.json
            data/image-variants.json
            data/gemrate-psa-history.json
            data/psa-population-snapshots.json
            data/psa-edition-weekly.json
            data/gemrate-psa-en-totals.json
            data/price-quality-audit.json
            data/active-listing-audit.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit changes
        run: |
          if git diff --quiet data/grading-series.json data/onepiece-packs.json data/box-sold-series.json data/image-variants.json data/gemrate-psa-history.json data/psa-population-snapshots.json data/psa-edition-weekly.json data/gemrate-psa-en-totals.json data/price-quality-audit.json data/active-listing-audit.json sets/ cards/ ko/ articles/ img/ card-img/ psa-grading.html psa10-ranking.html market-2026.html feed.xml auction.html tcg-auction.html box-prices.html compare.html index.html packs.html free-data.html weekly.html opbox-ai-data.json opbox-ai-cards.json opbox-ai-grading.json opbox-ai-auctions.json llms.txt llms-full.txt opbox-set-prices.csv opbox-grading-population.csv opbox-auction-daily.csv sitemap.xml data/sitemap-lastmod-state.json ja/ about.html amazon-lottery.html changelog.html disclaimer.html methodology.html privacy.html; then
            echo "No market data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/grading-series.json data/onepiece-packs.json data/box-sold-series.json data/image-variants.json data/gemrate-psa-history.json data/psa-population-snapshots.json data/psa-edition-weekly.json data/gemrate-psa-en-totals.json data/price-quality-audit.json data/active-listing-audit.json sets/ cards/ ko/ articles/ img/ card-img/ psa-grading.html psa10-ranking.html market-2026.html feed.xml auction.html tcg-auction.html box-prices.html compare.html index.html packs.html free-data.html weekly.html opbox-ai-data.json opbox-ai-cards.json opbox-ai-grading.json opbox-ai-auctions.json llms.txt llms-full.txt opbox-set-prices.csv opbox-grading-population.csv opbox-auction-daily.csv sitemap.xml data/sitemap-lastmod-state.json ja/ about.html amazon-lottery.html changelog.html disclaimer.html methodology.html privacy.html
          if ! git diff --quiet; then
            echo "::error::Tracked generated files remain unstaged. Update the explicit commit scope before publishing."
            git status --short
            exit 1
          fi
          git commit -m "Update market data"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Push failed after 3 attempts. Fresh market pages were not published."
              exit 1
            fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Generated files conflict with newer main. Manual review required."
              exit 1
            fi
            # rebase 로 원본·생성기가 바뀌었을 수 있다 — 같은 순서(build → check)로 전부 다시 굽는다, 2026-10-15.
            node tools/build.js
            node tools/check.js --gate
            git add data/grading-series.json data/onepiece-packs.json data/box-sold-series.json data/image-variants.json data/gemrate-psa-history.json data/psa-population-snapshots.json data/psa-edition-weekly.json data/gemrate-psa-en-totals.json data/price-quality-audit.json data/active-listing-audit.json sets/ cards/ ko/ articles/ img/ card-img/ psa-grading.html psa10-ranking.html market-2026.html feed.xml auction.html tcg-auction.html box-prices.html compare.html index.html packs.html free-data.html weekly.html opbox-ai-data.json opbox-ai-cards.json opbox-ai-grading.json opbox-ai-auctions.json llms.txt llms-full.txt opbox-set-prices.csv opbox-grading-population.csv opbox-auction-daily.csv sitemap.xml data/sitemap-lastmod-state.json ja/ about.html amazon-lottery.html changelog.html disclaimer.html methodology.html privacy.html
            if ! git diff --quiet; then
              echo "::error::Post-rebase regeneration left tracked files unstaged."
              git status --short
              exit 1
            fi
            git diff --cached --quiet || git commit --amend --no-edit
            sleep $((attempt * 5))
          done

      - name: Verify PSA population snapshot freshness
        if: always()
        run: |
          node tools/update-psa-weekly-history.js --check-freshness
