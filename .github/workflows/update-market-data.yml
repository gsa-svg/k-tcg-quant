name: Update market data

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 05:00 KST (Sunday 20:00 UTC) — staggered 2h after the daily
    # active-listings run (18:00 UTC) to avoid a same-time push race on onepiece-packs.json.
    - cron: "0 20 * * 0"

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      EBAY_MARKETPLACE_ID: EBAY_US
      EBAY_SEARCH_LIMIT: "100"
      EBAY_PSA_SEARCH_LIMIT: "100"
      EBAY_ENGLISH_NM_SEARCH_LIMIT: "100"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify scripts
        run: |
          node --check packs.js
          node --check tools/update-ebay-pack-prices.js
          node --check tools/update-ebay-english-nm-prices.js
          node --check tools/update-ebay-japanese-nm-sold-prices.js
          node --check tools/update-box-series-history.js
          node --check tools/update-psa-weekly-history.js
          node --check tools/collect-gemrate-psa-history.js
          node --check tools/import-gemrate-psa-history.js
          node --check tools/collect-gemrate-en-totals.js
          node --check tools/collect-psa-edition-weekly.js
          node --check tools/build-market-index.js
          node --check tools/audit-grading-numbers.js
          node --check tools/inject-psa-wow.js
          node --check tools/generate-psa-grading-page.js
          node --check tools/audit-price-quality.js
          node --check tools/audit-active-listings.js
          node --check tools/generate-card-pages.js
          node --check tools/generate-set-pages.js
          node --check tools/generate-upcoming-set-pages.js
          node --check tools/generate-ko-pages.js
          node --check tools/generate-ko-topic-pages.js
          node --check tools/generate-auction-page.js
          node --check tools/guard-invariants.js
          node --check tools/audit-adsense-readiness.js
          node --check tools/audit-seo.js
          node --check tools/audit-ai-discovery.js
          node --check tools/run-with-retry.js
          node tools/test-price-outliers.js
          node tools/test-price-quality-audit.js
          node tools/test-update-psa-weekly-history.js
          node tools/test-collect-gemrate-psa-history.js
          node tools/test-pop-ingest-guards.js
          node tools/test-import-gemrate-psa-history.js
          node tools/audit-seo.js
          node tools/audit-ai-discovery.js

      - name: Require eBay API secrets
        run: |
          if [ -z "$EBAY_CLIENT_ID" ] || [ -z "$EBAY_CLIENT_SECRET" ]; then
            echo "::error::Missing EBAY_CLIENT_ID or EBAY_CLIENT_SECRET repository secret. Market data refresh cannot run safely."
            exit 1
          fi

      - name: Update eBay pack prices
        run: |
          set -o pipefail
          mkdir -p logs
          node tools/run-with-retry.js --attempts 3 --delay-ms 10000 -- node tools/update-ebay-pack-prices.js 2>&1 | tee logs/update-ebay-pack-prices.log

      - name: Update eBay English NM prices
        run: |
          set -o pipefail
          mkdir -p logs
          node tools/run-with-retry.js --attempts 3 --delay-ms 10000 -- node tools/update-ebay-english-nm-prices.js 2>&1 | tee logs/update-ebay-english-nm-prices.log

      - name: Update eBay Japanese NM sold prices
        run: |
          set -o pipefail
          mkdir -p logs
          node tools/update-ebay-japanese-nm-sold-prices.js --continue-on-error 2>&1 | tee logs/update-ebay-japanese-nm-sold-prices.log

      - name: Append box price history snapshot
        run: |
          set -o pipefail
          mkdir -p logs
          node tools/update-box-series-history.js 2>&1 | tee logs/update-box-series-history.log

      # ⚠️ GemRate 수집은 러너에서 자주 실패한다("OP-01: GemRate RowData unavailable").
      #    로컬 크롬(사용자 IP)에서는 같은 스크립트가 멀쩡히 도는 걸로 보아 데이터센터 IP 쪽 차단으로 보인다.
      #    이 스텝이 죽으면서 **뒤의 모든 스텝(가격 감사·페이지 재생성·커밋)까지 통째로 스킵**돼,
      #    2026-07-27·08-03 두 주 동안 주간 갱신이 아무것도 커밋되지 않았다(2026-08-03 확인).
      #    PSA 는 어차피 매주 월요일에 사람이 로컬에서 돌리기로 했으므로(HANDOFF 참고),
      #    여기서는 실패해도 나머지를 계속 진행시킨다. 값을 지어내는 게 아니라 그 주 PSA 점만 비는 것이다.
      - name: Collect and append verified PSA weekly history
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p logs
          node tools/collect-gemrate-psa-history.js 2>&1 | tee logs/collect-gemrate-psa-history.log
          node tools/import-gemrate-psa-history.js 2>&1 | tee logs/import-gemrate-psa-history.log

      # 판별(일본판/영문판) 누적을 매주 한 점씩 쌓는다. 화면에는 최근 두 점의 차이만 쓰지만
      # 점을 계속 보존해야 몇 달 뒤에 주차별 증가량을 우리 데이터로 말할 수 있다(소급 불가).
      # 위와 같은 이유로 실패해도 뒤를 막지 않는다 — 단, audit-grading-numbers 는 여기서 빼내
      # 별도 스텝으로 두어 **등급 숫자 검증은 계속 강제**한다(그건 실패하면 진짜 멈춰야 한다).
      - name: Append per-edition PSA cumulative snapshot
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p logs
          node tools/collect-gemrate-en-totals.js 2>&1 | tee logs/collect-gemrate-en-totals.log
          node tools/collect-psa-edition-weekly.js 2>&1 | tee logs/collect-psa-edition-weekly.log
          node tools/import-gemrate-en-totals.js 2>&1 | tee logs/import-gemrate-en-totals.log
          node tools/inject-psa-wow.js 2>&1 | tee logs/inject-psa-wow.log

      # 등급 숫자는 틀리면 안 된다(소유자 지시). 젬률 계산, 주간 증감, 등급사별 증감 구간 라벨이
      # 원본과 맞는지 여기서 막는다. 위 수집이 건너뛰어졌더라도 **이 검증만은 반드시 통과해야 한다**.
      # 카드별 등급(PSA·CGC·TAG)을 화면 데이터(onepiece-packs.json)로 주입 — 2026-08-20.
      # 원장은 갱신되는데 이 단계가 어디에도 없어서, 카드 확대창이 2026-08-10 값에 멈춰 있었다.
      # 원장만 새것이고 화면은 옛것인 사고는 조용해서 사용자가 먼저 발견한다.
      - name: Inject card grades
        run: node tools/inject-card-grades.js

      # 세트 × 등급사 × 주차 누적 시계열을 다시 굽는다 — 2026-08-19.
      # 원장 셋(PSA·CGC·TAG)이 구조가 달라서, 그래프를 그릴 때마다 형식을 맞추지 않도록
      # 한 파일로 정규화해 둔다. 파생이라 언제 다시 구워도 같은 값이 나온다.
      - name: Build grading series
        run: node tools/build-grading-series.js

      - name: Audit grading numbers
        run: |
          set -o pipefail
          mkdir -p logs
          node tools/audit-grading-numbers.js 2>&1 | tee logs/audit-grading-numbers.log

      - name: Audit price quality
        run: |
          set -o pipefail
          mkdir -p logs
          node tools/audit-price-quality.js --hide-suspicious-nm 2>&1 | tee logs/audit-price-quality-hide.log
          node tools/audit-price-quality.js 2>&1 | tee logs/audit-price-quality.log
          node tools/audit-active-listings.js 2>&1 | tee logs/audit-active-listings.log

      - name: Regenerate SEO pages with fresh market data
        run: |
          set -o pipefail
          node tools/compact-series.js 2>&1 | tee logs/compact-series.log
          # 지수 화면은 삭제됐지만 board/reprints 는 홈 요약표·ko·CSV 가 쓴다 — 갱신 필수.
          node tools/build-market-index.js 2>&1 | tee logs/build-market-index.log
          node tools/generate-psa-grading-page.js 2>&1 | tee logs/generate-psa-grading-page.log
          node tools/generate-card-pages.js 2>&1 | tee logs/generate-card-pages.log
          node tools/generate-set-pages.js 2>&1 | tee logs/generate-set-pages.log
          node tools/generate-upcoming-set-pages.js 2>&1 | tee logs/generate-upcoming-set-pages.log
          node tools/generate-ko-pages.js 2>&1 | tee logs/generate-ko-pages.log
          node tools/generate-ko-topic-pages.js 2>&1 | tee logs/generate-ko-topic-pages.log
          node tools/generate-auction-page.js 2>&1 | tee logs/generate-auction-page.log
          node tools/guard-invariants.js 2>&1 | tee logs/guard-invariants.log
          node tools/audit-seo.js 2>&1 | tee logs/audit-seo.log
          node tools/audit-ai-discovery.js 2>&1 | tee logs/audit-ai-discovery.log

      - name: Upload update logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-update-logs
          path: |
            logs/
            data/price-quality-audit.json
            data/japanese-nm-sold-audit.json
            data/active-listing-audit.json
          if-no-files-found: ignore

      - name: Commit changes
        run: |
          if git diff --quiet data/grading-series.json data/onepiece-packs.json data/gemrate-psa-history.json data/psa-population-snapshots.json data/psa-edition-weekly.json data/gemrate-psa-en-totals.json data/price-quality-audit.json data/japanese-nm-sold-audit.json data/active-listing-audit.json sets/ cards/ ko/ psa-grading.html psa10-ranking.html auction.html sitemap.xml; then
            echo "No market data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/grading-series.json data/onepiece-packs.json data/gemrate-psa-history.json data/psa-population-snapshots.json data/psa-edition-weekly.json data/gemrate-psa-en-totals.json data/price-quality-audit.json data/japanese-nm-sold-audit.json data/active-listing-audit.json sets/ cards/ ko/ psa-grading.html psa10-ranking.html auction.html sitemap.xml
          if ! git diff --quiet; then
            echo "::error::Tracked generated files remain unstaged. Update the explicit commit scope before publishing."
            git status --short
            exit 1
          fi
          git commit -m "Update market data"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Push failed after 3 attempts. Fresh market pages were not published."
              exit 1
            fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Generated files conflict with newer main. Manual review required."
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Verify PSA population snapshot freshness
        if: always()
        run: |
          node tools/update-psa-weekly-history.js --check-freshness
